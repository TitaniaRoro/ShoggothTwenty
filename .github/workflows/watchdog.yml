name: watchdog

on:
  schedule:
    # Every two hours at an off-peak minute, plus a daily sweep.
    #
    # This used to be daily, which was fine when the heartbeat ran 48 times a
    # day. It does not: GitHub has been dropping the heartbeat's schedule
    # entirely — ten consecutive slots, no runs, no cancellations, just
    # nothing. A watchdog that checks once a day can be up to 24 hours late
    # to a fault it could have fixed itself.
    #
    # Every entry is a separate chance to run, since dropped schedules appear
    # to be per-slot rather than per-workflow.
    - cron: '37 5 * * *'
    # Every 30 minutes, not every two hours. Same reasoning as the heartbeat:
    # roughly one slot in ten survives, so 12 slots a day produced about one
    # watchdog run - which meant a stalled heartbeat could sit undetected for
    # most of a day. At 48 slots the check lands often enough to matter.
    - cron: '11,41 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # write, not read: the watchdog re-triggers a stalled heartbeat via
  # `gh workflow run`. Alerting about a stopped agent while having the means
  # to restart it is the wrong side of the line.
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Optional hardening: see README setup step 4.
    # environment: moltbook-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect silent death
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: ./scripts/watchdog.sh
