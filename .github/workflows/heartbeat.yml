name: heartbeat

on:
  schedule:
    # Every 10 minutes, at off-peak minutes.
    #
    # This used to be every 30 (48 slots/day). Measured against this repo,
    # roughly one slot in ten actually produces a run: the observed gaps were
    # 6.2h, 6.7h, 4.3h, 3.6h, 2.9h, 6.4h — about five runs a day where the
    # cron asked for forty-eight.
    #
    # Survival looks close to proportional, not fixed, so the way to shorten
    # the wait is to offer more slots. 144 slots at the same rate should land
    # nearer fifteen runs a day, cutting the average gap from ~5h to ~1.5h.
    #
    # Never :00 or :30, and never on the hour: GitHub's docs say high-load
    # times "include the start of every hour" and that some queued jobs are
    # dropped. Cron is UTC only - there is no timezone support.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without sending Telegram messages'
        type: boolean
        default: true

permissions:
  contents: write   # only because the run commits its dedupe state back

concurrency:
  group: heartbeat
  cancel-in-progress: false   # never cancel mid-write; serialize instead

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Optional hardening: move the secrets into an environment restricted to the
    # default branch, then uncomment the next line. See README setup step 4.
    # environment: moltbook-agent
    steps:
      # Pinned to commit SHAs: this repo is public and holds secrets, so a
      # mutable tag on a third-party action is an unnecessary risk.
      # persist-credentials is explicit, not inherited: the state commit at the
      # end of this job pushes back to the repo, so it needs a working credential
      # regardless of what checkout's default happens to be this major version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install --require-hashes -r requirements.txt

      # Untrusted text never reaches a shell: post content stays inside Python.
      - name: Heartbeat
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python agent.py run

      # Shadow mode. The agent drafts what it would say and sends it to Telegram
      # for approval; nothing is posted to Moltbook until a human taps Approve.
      # With no model key configured this is a no-op that logs and exits zero.
      - name: Propose actions for approval
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
          # Optional. The code already read these env vars but nothing passed
          # them, so a retired model could only be fixed by editing code.
          # Set either as a repository variable to override the default.
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python agent.py propose --max-drafts 3

      # Exit 3 means "interval not elapsed" — not an error, just nothing to do.
      # Runs with always() so a broken heartbeat can't also kill the keepalive.
      - name: Arm the state commit
        id: state
        if: always()
        continue-on-error: true
        env:
          STATE_PATH: state/state.json
        run: python agent.py commit-state

      # This commit does two jobs: it persists dedupe state, and it is the
      # repository activity that stops GitHub disabling this schedule after 60
      # days of no commits. Do not remove it.
      - name: Commit state
        if: always() && steps.state.outcome == 'success'
        run: |
          git config user.name "shoggoth-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "no state change to commit"
            exit 0
          fi
          git commit -m "state: heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              echo "state committed"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::state commit failed after 3 attempts; the next run will retry"

      - name: Keep the audit log out of the repository
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heartbeat-failure
          path: audit/
          retention-days: 7
          if-no-files-found: ignore
